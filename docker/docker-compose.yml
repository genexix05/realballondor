version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: realballondor-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ballondor
      POSTGRES_USER: ballondor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - realballondor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballondor -d ballondor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: realballondor-api
    restart: unless-stopped
    ports:
      - "8800:8000"
    environment:
      DATABASE_URL: postgresql://ballondor:${POSTGRES_PASSWORD}@postgres:5432/ballondor
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      BALLONDOR_ROOT: /app
    volumes:
      - ../data/raw/fotmob:/app/data/raw/fotmob:ro
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  realballondor_pgdata:
