[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ballondor"
version = "0.1.0"
description = "Ballon d'Or Statistical Index — match-level performance ranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "requests>=2.32",
  "lxml>=5.0",
  "html5lib>=1.1",
  "beautifulsoup4>=4.12",
  "pyarrow>=17.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# FBref serves 403 to plain HTTP clients, so it needs a real browser.
fbref = ["seleniumbase>=4.30", "soccerdata>=1.8", "rdata>=1.1"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
