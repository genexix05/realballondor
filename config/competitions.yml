# Valor de cada título para el componente de palmarés (18% del índice).
# El Mundial vale más que la Champions (1,20 vs 1,00): se juega cada cuatro
# años y en el Balón de Oro real ha sido decisivo. El crédito se escala por
# minutos contra el compañero más usado de la misma posición, no contra
# el portero que jugó todo.
#
# Ligas Big 5: ancla Premier = 0.80 (por debajo de Champions 1.00), el resto
# sqrt(coef_país / 23.0) con el coeficiente UEFA 2025 (ENG 23.0, ITA 19.4,
# ESP 18.9, GER 17.3, FRA 14.6). Misma raíz que opponent strength.
trophies:
  INT-World Cup:             {winner: 1.20, runner_up: 0.45}
  UEFA-Champions League:     {winner: 1.00, runner_up: 0.35}
  INT-Euro:                  {winner: 0.85, runner_up: 0.30}
